<div class="page">
  <header>
    <img class="logo" src="./assets/img/logo2.png" alt="error">
    <nav>
      <a class="mat-flat-button warning" routerLink="/menu">Przerwanie Dyplomowania</a>
    </nav>
  </header>

  <main>
    <div class="full_panel diploma">

      <div class="diploma-box">
        <!--        <div class="questions">-->
        <!--          <div *ngFor="let question of dataSource.data; let i = index" class=" row">-->
        <!--            <div class="column question" style="width: 100%">-->
        <!--              <div (click)="displayAnswer(question.id)">{{ question.question }}</div>-->
        <!--            </div>-->
        <!--            <div class="column" style="width: 96px">-->
        <!--              <input-->
        <!--                required-->
        <!--                [min]="2"-->
        <!--                [max]="5"-->
        <!--                [step]="0.5"-->
        <!--                type="number"-->
        <!--                [(ngModel)]="answerGrade[i]"-->
        <!--                (input)="updateDiplomaGrade()"-->
        <!--              />-->
        <!--            </div>-->
        <!--          </div>-->
        <!--        </div>-->


        <div class="mat-elevation-z2 exam-layout">
          <!-- Left Panel: List of Questions -->
          <mat-nav-list class="question-list">
            <ng-container *ngFor="let question of dataSource.data">
              <mat-list-item
                (click)="selectQuestion(question)"
                [class.selected]="question.id === selectedQuestion?.id"
              >
                <div class="question-item-text">
                  {{ question.question }}
                </div>
              </mat-list-item>
              <mat-divider></mat-divider>
            </ng-container>
          </mat-nav-list>

          <div class="question-details" *ngIf="selectedQuestion">
            <h2>{{ selectedQuestion.question }}</h2>
            <mat-divider></mat-divider>

            <p class="answer-display">{{ answer ?? "To pytanie nie ma odpowiedzi" }}</p>

            <div class="grade-input">
              <label for="grade">Ocena odpowiedzi:</label>
              <input
                id="grade"
                required
                [min]="2"
                [max]="5"
                [step]="0.5"
                type="number"
                [(ngModel)]="answerGrade[selectedQuestionIndex]"
                (input)="updateDiplomaGrade()"
              />
            </div>
          </div>
        </div>

        <div class="row row-center grade">
          <div class="column">
            <label>
              Ocena prezentacji
            </label>

            <input
              required
              [min]="2"
              [max]="5"
              [step]="0.5"
              type="number"
              [(ngModel)]="diplomaGrade"
              (input)="updateDiplomaGrade()"
            />

          </div>

          <div class="column">
            <label>
              Ocena pracy
            </label>
            <input
              required
              [min]="2"
              [max]="5"
              [step]="0.5"
              type="number"
              [(ngModel)]="thesisGrade"
              class="form-control"
              (input)="updateThesisGrade($event)"
            />
          </div>
        </div>

        <button class="diploma-accept-button" [disabled]="
      !diplomaGrade ||
      diplomaGrade < 2 ||
      diplomaGrade > 5 ||
      !thesisGrade ||
      thesisGrade < 2 ||
      thesisGrade > 5
    " routerLink="/userSummary/{{ student.albumNum }}">
          Akceptuj
        </button>
      </div>
    </div>
  </main>
</div>


<div class="question-answer-box" [ngClass]="{'hidden': isAnswerShowed === false}" (click)="hideAnswer()">
  <div class="answer" (click)="hideAnswer()">
    <p>{{answer ?? "To pytanie nie ma odpowiedzi"}}</p>
  </div>
</div>
